<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Pixel Battle</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        #canvas {
            border: 3px solid #444;
            background-color: #fff;
            cursor: crosshair;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #status {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>🎨 ПИКСЕЛЬ-БАТЛ</h1>
    <canvas id="canvas" width="500" height="500"></canvas>

    <div class="controls">
        <label for="colorPicker">Выбери цвет:</label>
        <input type="color" id="colorPicker" value="#ff0000">
    </div>

    <div id="status">Подключение к серверу...</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        const colorPicker = document.getElementById('colorPicker');


        const BOARD_SIZE = 100;
        const PIXEL_SIZE = canvas.width / BOARD_SIZE; // 500 / 100 = 5px на пиксель


        const userId = "user_" + Math.floor(Math.random() * 10000);


        const ws = new WebSocket('ws://localhost:8000/ws');

        ws.onopen = () => {
            statusDiv.innerHTML = '<span style="color: #00ff00;">✅ В БОЮ! (Подключено)</span>';

            loadCanvas();
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);


            if (data.error) {
                statusDiv.innerHTML = `<span style="color: #ff4444;">⚠️ ${data.error}</span>`;
                return;
            }


            drawPixel(data.x, data.y, data.color);
            statusDiv.innerHTML = `<span style="color: #00ff00;">🎯 Игрок ${data.user} закрасил (${data.x}, ${data.y})</span>`;
        };


        function drawPixel(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x * PIXEL_SIZE, y * PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
        }


        async function loadCanvas() {
            try {
                const res = await fetch('http://localhost:8000/canvas');
                const data = await res.json();
                const canvasData = data.canvas;

                for (let index in canvasData) {
                    const color = canvasData[index];
                    const x = index % BOARD_SIZE;
                    const y = Math.floor(index / BOARD_SIZE);
                    drawPixel(x, y, color);
                }
            } catch (e) {
                console.log("Ошибка загрузки холста:", e);
            }
        }


        canvas.addEventListener('click', (event) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;


            const x = Math.floor(mouseX / PIXEL_SIZE);
            const y = Math.floor(mouseY / PIXEL_SIZE);


            ws.send(JSON.stringify({
                user_id: userId,
                x: x,
                y: y,
                color: colorPicker.value
            }));
        });
    </script>
</body>
</html>
